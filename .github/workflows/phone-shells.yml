# The native port's phone shells (plan item E19): a debug APK and an unsigned simulator app,
# built from platform/android and platform/ios, as workflow artifacts. A prototype for people
# with devices (docs/port/device-notes.md); rust.yml keeps building the Tauri apps until item P10
# folds these jobs into it.
name: Phone shells

on:
  push:
    branches: ["rust-port", "main"]
    paths:
      - "platform/**"
      - "crates/app/Cargo.toml"
      - "crates/app/src/lib.rs"
      - "crates/app/src/platform/**"
      - ".github/workflows/phone-shells.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "platform/**"
      - "crates/app/**"
      - ".github/workflows/phone-shells.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # line tables only: stack traces with lines, and a debug library of a sensible size
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: phone-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Rust library (arm64-v8a)
        run: platform/android/build-rust.sh arm64-v8a

      - name: Gradle
        working-directory: platform/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp platform/android/app/build/outputs/apk/debug/app-debug.apk dist/RustRadar_native_debug.apk
          ls -l dist platform/android/app/src/main/jniLibs/*

      - uses: actions/upload-artifact@v4
        with:
          name: android-native-debug-apk
          path: dist/*.apk

  ios:
    name: iOS simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: phone-ios

      - name: Xcode project
        working-directory: platform/ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      # the device library too, so a broken iPhone build shows here and not first in P9
      - name: Rust library for devices
        run: platform/ios/build-rust.sh iphoneos Debug "$RUNNER_TEMP/iphoneos"

      - name: Simulator app (unsigned)
        working-directory: platform/ios
        run: |
          xcodebuild -project RustRadar.xcodeproj -scheme RustRadar -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Collect the app
        run: |
          mkdir -p dist
          app=platform/ios/build/Build/Products/Debug-iphonesimulator/RustRadar.app
          plutil -p "$app/Info.plist"
          ditto -c -k --keepParent "$app" dist/RustRadar_native_simulator.app.zip
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-native-simulator-app
          path: dist/*.zip
