name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install Linux dependencies
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libglib2.0-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf
    - name: Build
      run: cargo build --release --verbose
    - name: Run tests
      if: startsWith(matrix.os, 'ubuntu-')
      run: cargo test --verbose
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustradar-${{ matrix.os }}
        path: |
          target/release/rustradar
          target/release/rustradar.exe

  build-archlinux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build and test on Arch Linux
      uses: uraimo/run-on-arch-action@v3
      with:
        arch: none
        distro: none
        base_image: archlinux:latest
        install: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git \
            rust \
            libwebkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            patchelf
        run: |
          cargo build --release --verbose
          cargo test --verbose
