name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A push to main (or a v* tag) publishes a release the installed apps update from.
  RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  # Fast feedback: frontend type-check + Rust tests for the whole workspace.
  check:
    name: Check & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          # Cargo workspace root; target/ lives at the repo root.
          workspaces: ". -> target"
          shared-key: check

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The version is in four files; the updater and --locked both depend on them agreeing.
      - name: Versions agree
        run: bun run bump --check

      - name: Frontend check (svelte-check)
        run: bun run check

      - name: Unit tests
        run: bun test src

      # tauri::generate_context!() needs frontendDist (../build) to exist at compile time.
      - name: Build frontend
        run: bun run build

      - name: Rust tests
        run: cargo test --workspace --locked

  # The version a release publishes, worked out once for every platform: the
  # files' version, or the next patch after the latest release if that one is
  # already out (installed apps only update to a newer version).
  version:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          version="$(bash scripts/release-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version (files say $(node -p 'require("./package.json").version'))" >> "$GITHUB_STEP_SUMMARY"

  # Installers for every platform via tauri-action.
  bundle:
    name: Bundle (${{ matrix.name }})
    needs: version
    permissions:
      contents: write # needed to create the draft release on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            platform: windows-latest
            args: ""
          - name: macos-aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x86_64
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: linux-x86_64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both mac targets so either matrix leg can build from the arm64 runner.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Fail in seconds, naming the mistake, rather than after the whole build
      # when signing the update bundles. Prints only lengths, never the key.
      - name: Check signing key
        if: env.RELEASE == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/check-signing-key.sh

      # A main build whose version was already released gets the next patch, so
      # installed copies see it as an update. Only this build's files change;
      # nothing is committed. (A v* tag publishes the version it names.)
      - name: Set release version
        if: env.RELEASE == 'true' && !startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/version.mjs "${{ needs.version.outputs.version }}"

      # Note: crates/fr24 compiles its protos with protox (pure Rust), so no protoc is needed.
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing / notarization (not required; builds are unsigned without these) ---
          # macOS (see https://v2.tauri.app/distribute/sign/macos/):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: configure bundle.windows.certificateThumbprint / signCommand in tauri.conf.json
          # (see https://v2.tauri.app/distribute/sign/windows/).
          # Signs the update bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          # Update bundles and their signatures only for releases: pull requests
          # (forks, bots) have no signing key, and don't need them.
          args: ${{ matrix.args }} ${{ env.RELEASE == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          # Installers as workflow artifacts on every run (push, PR, tag).
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[name]_[version]_[platform]_[arch]_[bundle]"
          # Every push to main publishes a release named after the version set
          # above, with a latest.json that installed apps read at launch. A v*
          # tag publishes under its own name instead.
          tagName: ${{ env.RELEASE == 'true' && (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__') || '' }}
          releaseName: "RustRadar v__VERSION__"
          releaseBody: "Installed copies update to this version automatically the next time they open."
          # Not a draft: `releases/latest/download/latest.json` only sees published releases.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # Android: a debug APK on every run to try out, and on a release a signed
  # APK for the release page (the app offers it as an update; see
  # src-tauri/src/mobile_update.rs). Signing needs the ANDROID_KEYSTORE,
  # ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets; without them a
  # release goes out with no APK and a warning.
  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set release version
        if: env.RELEASE == 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs "${{ needs.version.outputs.version }}"

      - name: Signing keystore
        id: keystore
        if: env.RELEASE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::warning::No Android signing secrets (ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS): this release has no APK."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=$PASSWORD"
            echo "keyAlias=$ALIAS"
          } > src-tauri/gen/android/keystore.properties
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        if: steps.keystore.outputs.ready == 'true'
        run: bun tauri android build --apk

      - name: Build a debug APK
        if: steps.keystore.outputs.ready != 'true'
        run: bun tauri android build --apk --debug --target aarch64

      - name: Name the APK
        run: |
          version="$(node -p 'require("./package.json").version')"
          kind=${{ steps.keystore.outputs.ready == 'true' && 'release' || 'debug' }}
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name "*-$kind.apk" | head -n 1)"
          suffix=$([ "$kind" = release ] && echo "" || echo "_debug")
          mkdir -p dist && cp "$apk" "dist/RustRadar_${version}${suffix}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  # iOS: an IPA on every run, attached to the release page on a release. With
  # the APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_KEY (the .p8 file's
  # contents) and APPLE_DEVELOPMENT_TEAM secrets, a release's build is signed
  # through App Store Connect and uploaded to TestFlight; without them the IPA
  # is unsigned, for sideloading tools that sign it themselves.
  ios:
    name: iOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ios

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: App Store Connect key
        id: asc
        if: env.RELEASE == 'true'
        env:
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY: ${{ secrets.APPLE_API_KEY }}
          TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$ISSUER" ] || [ -z "$KEY_ID" ] || [ -z "$KEY" ] || [ -z "$TEAM" ]; then
            echo "::warning::No App Store Connect secrets (APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_KEY, APPLE_DEVELOPMENT_TEAM): an unsigned IPA, and nothing for TestFlight."
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$key"
          {
            echo "APPLE_API_ISSUER=$ISSUER"
            echo "APPLE_API_KEY=$KEY_ID"
            echo "APPLE_API_KEY_ID=$KEY_ID"
            echo "APPLE_API_KEY_PATH=$key"
            echo "APPLE_DEVELOPMENT_TEAM=$TEAM"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set release version
        if: env.RELEASE == 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs "${{ needs.version.outputs.version }}"

      - name: Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          bun tauri ios init --ci
          # the Xcode project starts with Tauri's logo: the app's own icon over it
          bun tauri icon src-tauri/icons/icon.png

      # Without the App Store Connect secrets: an unsigned IPA, for sideloading
      # tools (AltStore, Sideloadly) that sign it with the user's own Apple ID.
      - name: Build an unsigned IPA
        if: steps.asc.outputs.ready != 'true'
        run: |
          bun tauri ios build --no-sign
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)"
          version="$(node -p 'require("./package.json").version')"
          mkdir -p dist && cp "$ipa" "dist/RustRadar_${version}_unsigned.ipa"
          ls -l dist

      - name: Build for the App Store
        if: steps.asc.outputs.ready == 'true'
        run: bun tauri ios build --export-method app-store-connect

      - name: Upload to TestFlight
        if: steps.asc.outputs.ready == 'true'
        run: |
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          version="$(node -p 'require("./package.json").version')"
          mkdir -p dist && cp "$ipa" "dist/RustRadar_${version}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa

  # The phone builds on the release the desktop bundles created.
  mobile-release:
    name: Attach phone builds
    needs: [version, bundle, android, ios]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # either may be missing: a build without its signing secrets
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: dist

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          shopt -s nullglob
          files=(dist/*.ipa)
          for apk in dist/*.apk; do
            # a debug APK means the release had no signing key: not for users
            [[ "$apk" == *_debug.apk ]] || files+=("$apk")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No signed phone builds to attach."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
