name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback: frontend type-check + Rust tests for the whole workspace.
  check:
    name: Check & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          # Cargo workspace root; target/ lives at the repo root.
          workspaces: ". -> target"
          shared-key: check

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend check (svelte-check)
        run: bun run check

      # tauri::generate_context!() needs frontendDist (../build) to exist at compile time.
      - name: Build frontend
        run: bun run build

      - name: Rust tests
        run: cargo test --workspace --locked

  # Installers for every platform via tauri-action.
  bundle:
    name: Bundle (${{ matrix.name }})
    permissions:
      contents: write # needed to create the draft release on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            platform: windows-latest
            args: ""
          - name: macos-aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x86_64
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: linux-x86_64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both mac targets so either matrix leg can build from the arm64 runner.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Note: crates/fr24 compiles its protos with protox (pure Rust), so no protoc is needed.
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing / notarization (not required; builds are unsigned without these) ---
          # macOS (see https://v2.tauri.app/distribute/sign/macos/):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: configure bundle.windows.certificateThumbprint / signCommand in tauri.conf.json
          # (see https://v2.tauri.app/distribute/sign/windows/).
          # Updater artifacts (only if the updater plugin is added later):
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          # Installers as workflow artifacts on every run (push, PR, tag).
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[name]_[version]_[platform]_[arch]_[bundle]"
          # Only create/upload to a (draft) GitHub Release when a v* tag is pushed;
          # an empty tagName makes tauri-action skip the release step.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "RustRadar ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
