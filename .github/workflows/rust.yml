name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A push to main (or a v* tag) publishes a release the installed apps update from.
  RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  # Fast feedback: frontend type-check + Rust tests for the whole workspace.
  check:
    name: Check & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          # Cargo workspace root; target/ lives at the repo root.
          workspaces: ". -> target"
          shared-key: check

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend check (svelte-check)
        run: bun run check

      # tauri::generate_context!() needs frontendDist (../build) to exist at compile time.
      - name: Build frontend
        run: bun run build

      - name: Rust tests
        run: cargo test --workspace --locked

  # Installers for every platform via tauri-action.
  bundle:
    name: Bundle (${{ matrix.name }})
    permissions:
      contents: write # needed to create the draft release on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            platform: windows-latest
            args: ""
          - name: macos-aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x86_64
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: linux-x86_64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both mac targets so either matrix leg can build from the arm64 runner.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Note: crates/fr24 compiles its protos with protox (pure Rust), so no protoc is needed.
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing / notarization (not required; builds are unsigned without these) ---
          # macOS (see https://v2.tauri.app/distribute/sign/macos/):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: configure bundle.windows.certificateThumbprint / signCommand in tauri.conf.json
          # (see https://v2.tauri.app/distribute/sign/windows/).
          # Signs the update bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          # Update bundles and their signatures only for releases: pull requests
          # (forks, bots) have no signing key, and don't need them.
          args: ${{ matrix.args }} ${{ env.RELEASE == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          # Installers as workflow artifacts on every run (push, PR, tag).
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[name]_[version]_[platform]_[arch]_[bundle]"
          # Every push to main publishes a release named after the version in
          # tauri.conf.json (bump it to ship), with a latest.json that installed
          # apps read at launch. A v* tag publishes under its own name instead.
          tagName: ${{ env.RELEASE == 'true' && (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__') || '' }}
          releaseName: "RustRadar v__VERSION__"
          releaseBody: "Installed copies update to this version automatically the next time they open."
          # Not a draft: `releases/latest/download/latest.json` only sees published releases.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
