name: TestFlight refresh

# A TestFlight build expires 90 days after it is uploaded. Each day this asks
# App Store Connect how old the newest build is; past 60 days it builds the
# latest release again (a new build number: the day's date) and uploads it,
# so testers always have one that works. Run it by hand to upload one now.
#
# The latest release is built with the tooling its own tree has (doc 07 §9.4,
# §14.2): a tag that still holds the Tauri app (src-tauri/tauri.conf.json) with
# today's Tauri steps, a native one with `cargo xtask ios-release`.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Upload a new build whatever the newest one's age
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight-refresh

env:
  CARGO_TERM_COLOR: always
  MAX_AGE_DAYS: 60

jobs:
  check:
    name: Newest build's age
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      # the release workflow's cache of xtask (rust.yml, job `version`)
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: xtask
          save-if: false

      # built before the key is on disk: its dependencies' build scripts are third-party code
      - name: xtask
        run: cargo build -p xtask --locked

      - name: App Store Connect key
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # sets the step's outputs `days` (a very large number when there is no build) and `version`
      - name: Ask App Store Connect
        id: age
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: target/debug/xtask testflight-age

      - name: Due?
        id: due
        run: |
          days="${{ steps.age.outputs.days }}"
          if [ "${{ inputs.force }}" = "true" ] || [ "$days" -gt "$MAX_AGE_DAYS" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "**TestFlight:** newest build ${{ steps.age.outputs.version }} is $days days old: uploading a new one" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "**TestFlight:** newest build ${{ steps.age.outputs.version }} is $days days old: nothing to do" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The iOS job of the release workflow (rust.yml), for the latest release.
  upload:
    name: Upload a new build
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TREE: tauri while the tag holds the Tauri app, else native
      - name: The latest release
        run: |
          tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          [ -n "$tag" ] || { echo "::error::no release tag to build"; exit 1; }
          git checkout --quiet "$tag"
          tree=native
          if [ -f src-tauri/tauri.conf.json ]; then tree=tauri; fi
          {
            echo "TAG=$tag"
            echo "TREE=$tree"
            echo "BUILD_NUMBER=$(date -u +%Y%m%d%H)"
          } >> "$GITHUB_ENV"
          echo "Building $tag ($tree app)" >> "$GITHUB_STEP_SUMMARY"

      # ---- a tag of the Tauri app: today's steps

      - uses: oven-sh/setup-bun@v2
        if: env.TREE == 'tauri'

      - uses: dtolnay/rust-toolchain@stable
        if: env.TREE == 'tauri'
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        if: env.TREE == 'tauri'
        with:
          workspaces: ". -> target"
          key: ios

      - name: Install frontend dependencies
        if: env.TREE == 'tauri'
        run: bun install --frozen-lockfile

      - name: App Store Connect key
        if: env.TREE == 'tauri'
        env:
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY: ${{ secrets.APPLE_API_KEY }}
          TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$key"
          {
            echo "APPLE_API_ISSUER=$ISSUER"
            echo "APPLE_API_KEY=$KEY_ID"
            echo "APPLE_API_KEY_ID=$KEY_ID"
            echo "APPLE_API_KEY_PATH=$key"
            echo "APPLE_DEVELOPMENT_TEAM=$TEAM"
          } >> "$GITHUB_ENV"

      # the release's version (as rust.yml sets it), and a build number of its own: App Store
      # Connect takes a build only once, and a date sorts after the release's own (its version)
      - name: Version
        if: env.TREE == 'tauri'
        run: node scripts/version.mjs "${TAG#v}"

      - name: Xcode project
        if: env.TREE == 'tauri'
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
          bun tauri ios init --ci
          bun tauri icon src-tauri/icons/icon.png
          # (App Store Connect refuses icons with an alpha channel: see rust.yml)
          cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/

      - name: Build for the App Store
        if: env.TREE == 'tauri'
        run: bun tauri ios build --export-method app-store-connect --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD_NUMBER\"}}}"

      - name: Upload to TestFlight
        if: env.TREE == 'tauri'
        run: |
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "Uploaded $TAG as build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      # ---- a tag of the native app: rust.yml's ios-release job, with the build number

      - uses: dtolnay/rust-toolchain@master
        if: env.TREE == 'native'
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        if: env.TREE == 'native'
        with:
          workspaces: ". -> target"
          key: ios-release

      - name: xcodegen
        if: env.TREE == 'native'
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      # built in a step without the secrets: its dependencies' build scripts are third-party code
      - name: xtask
        if: env.TREE == 'native'
        run: cargo build -p xtask --locked

      # the release's version, as rust.yml writes it before the release build (a main push's
      # release carries a version its files do not), and the build number of its own
      - name: Version
        if: env.TREE == 'native'
        run: target/debug/xtask bump "${TAG#v}"

      # the App Store build and its upload (the xtask writes the key only after the archive and
      # removes it at the end)
      - name: Build for the App Store and upload to TestFlight
        if: env.TREE == 'native'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          target/debug/xtask ios-release --app-store --upload --version "${TAG#v}" --build-number "$BUILD_NUMBER" --out dist
          echo "Uploaded $TAG as build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
