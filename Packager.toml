# The desktop packages (doc 07 §13, plan stage 11 rows P5–P7): cargo-packager 0.11.8's configuration.
#
# Not read by `cargo packager` on its own: `cargo xtask package <format>...` (crates/xtask/src/package.rs)
# reads this file, adds what each build decides (`version`, the version files' one; `formats`, the one
# format it packs; `binaries-dir`, the release binary named `rustradar` with its installer kind patched
# into it; `out-dir`), and hands the whole to cargo-packager as its JSON configuration, run from the
# repository root, so the paths below are relative to this folder. cargo-packager refuses keys it does
# not know: every table here is one of its own.
#
# What cargo-packager 0.11.8 makes: deb, AppImage, pacman, NSIS, WiX (MSI), .app and dmg. It makes no
# rpm: that one is cargo-generate-rpm 0.21.1's, configured in platform/linux/rpm.toml.
#
# Each platform's part has its own tables below: Linux (P7) here; Windows (P5: [windows], [nsis],
# [wix]) and macOS (P6: [macos], [dmg]) add theirs at the end. The identity is today's Tauri app's
# (src-tauri/tauri.conf.json, src-tauri/Cargo.toml, doc 07 §13.6), so that each package upgrades
# the one installed today in place.

product-name = "RustRadar"
identifier = "com.felix.rustradar"
# src-tauri/Cargo.toml's description and authors, which Tauri's bundler wrote into the packages
# (the deb's Description and Maintainer, the rpm's Summary, the .desktop file's Comment).
description = "Live flight radar on a 3D globe, powered by a Rust port of fr24"
authors = ["you"]
# tauri.conf.json's bundle.icon. The Linux packages take the PNGs, installed by their pixel size as
# Tauri's bundler installs them: 32x32, 128x128 and 256x256@2 (the @2x one) under
# /usr/share/icons/hicolor/<size>/apps/rustradar.png.
icons = [
    "src-tauri/icons/32x32.png",
    "src-tauri/icons/128x128.png",
    "src-tauri/icons/128x128@2x.png",
    "src-tauri/icons/icon.icns",
    "src-tauri/icons/icon.ico",
]
# Today's binary name: /usr/bin/rustradar, the .desktop file's Exec and Icon, the window's app id.
binaries = [{ path = "rustradar", main = true }]

# ---- Linux (P7) ----------------------------------------------------------------------------------

# cargo-packager would write /usr/share/applications/rustradar.desktop (named after the binary, no
# StartupWMClass); today's packages install RustRadar.desktop (named after the product), so the file
# is platform/linux's copy of today's, added by `files` below.
[linux]
generate-desktop-entry = false

[deb]
# Package: rust-radar, the product name in kebab case as Tauri's bundler wrote it, so apt upgrades
# the installed Tauri package. (cargo-packager's default is the same; written out to keep it.)
package-name = "rust-radar"
# The native app links only libc, libm, libgcc_s and libstdc++ (cargo xtask package adds libc6 at
# the binary's newest glibc symbol version); what it opens at run time dpkg cannot see, so it is
# listed: for winit X11 (Xlib, Xlib-xcb, Xcursor, XInput2, xcb), Wayland (client, egl) and xkbcommon
# with its X11 part (winit on X11 panics without libxkbcommon-x11, plan stage 2 gap 7) and its
# libxcb-xkb; for wgpu the Vulkan and EGL loaders (Vulkan, else GL through EGL); for the keys
# dialog's file picker (rfd, through the desktop portal) libdbus; and the system's root certificates,
# which reqwest's TLS checks every connection against (without them the backend does not start: "failed
# to build http client"; WebKitGTK pulled them in for the Tauri package). The sonames the release
# binary names were read off it. Today's WebKitGTK and GTK are gone. Ubuntu 22.04's package names (the
# build's baseline, doc 07 §13.3).
depends = [
    "libgcc-s1",
    "libstdc++6",
    "libx11-6",
    "libx11-xcb1",
    "libxcursor1",
    "libxi6",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxcb-xkb1",
    "libwayland-client0",
    "libwayland-egl1",
    "libvulkan1",
    "libegl1",
    "libdbus-1-3",
    "ca-certificates",
]
files = { "platform/linux/RustRadar.desktop" = "usr/share/applications/RustRadar.desktop" }

[appimage]
# Bundled from the build machine (/usr/lib*) as the AppImage's own: xkbcommon and its X11 part with
# libxcb-xkb, which not every desktop has installed (Tauri's AppImage carried libxkbcommon through
# GTK). The display server's libraries, the Vulkan and EGL loaders and the drivers stay the system's.
libs = ["libxkbcommon.so.0", "libxkbcommon-x11.so.0", "libxcb-xkb.so.1"]
# Today's .desktop file, inside the AppImage under the binary's name: cargo-packager links
# `rustradar.desktop` at the AppImage's root to usr/share/applications/rustradar.desktop whatever the
# file is called (Tauri's AppImage had RustRadar.desktop there; the name inside an AppImage is read by
# no updater or package manager).
files = { "platform/linux/RustRadar.desktop" = "usr/share/applications/rustradar.desktop" }

# ---- Windows (P5) --------------------------------------------------------------------------------

# The NSIS installer and the MSI are made from tauri-bundler 2.10.1's templates (platform/windows), the
# ones that made today's RustRadar_<version>_x64-setup.exe and RustRadar_<version>_x64_en-US.msi, so that
# each upgrades today's install in place and the old Tauri updater can run it (doc 07 §7.2, §12.1, §13.1,
# §13.6). `cargo xtask package nsis msi` stages the binary as rustradar.exe (today's: $INSTDIR\rustradar.exe,
# the uninstall key's MainBinaryName), fills in what cargo-packager does not derive as tauri-bundler did
# (each template's head says what) and points `template` at that copy. No WebView2 bootstrapper: the
# native app has no webview. The publisher is the identifier's second part, `felix`, as both bundlers
# derive it (today's Manufacturer, CompanyName and Software\felix\RustRadar).
[windows]
# tauri-bundler's default, written out: cargo-packager hands the NSIS template no value without it.
allow-downgrades = true

[nsis]
template = "platform/windows/installer.nsi"
# Per user, $LOCALAPPDATA\RustRadar, HKCU, no elevation: tauri.conf.json sets no bundle.windows.nsis, and
# this is tauri-bundler's default.
installer-mode = "currentUser"
compression = "lzma"
languages = ["English"]
# tauri-bundler's English strings (its template's messages; cargo-packager's own file lacks some).
custom-language-file = { English = "platform/windows/English.nsh" }

[wix]
template = "platform/windows/main.wxs"
languages = ["en-US"]

# ---- macOS (P6) ----------------------------------------------------------------------------------

# One .app per architecture (aarch64 and x86_64, not universal), as today's release ships them:
# RustRadar_<version>_{aarch64,x64}.app.tar.gz (the updater's archive, with its .sig) and
# RustRadar_<version>_{aarch64,x64}.dmg. `cargo xtask package app dmg` makes RustRadar.app with
# cargo-packager (RustRadar.app/Contents/{Info.plist, MacOS/rustradar, Resources/icon.icns}: today's
# layout, the icon the .icns of `icons` above), seals it ad hoc with `codesign` (on macOS), archives it
# as tauri-bundler 2.10.1 archives it for the updater, and makes the disk image with tauri-bundler's
# own dmg script (platform/macos/bundle_dmg.sh) from the sealed bundle; cargo-packager's dmg would
# bundle an unsealed .app and skip today's Finder layout on CI. The binary keeps its installer kind
# unpatched (tauri-bundler patches nothing on macOS; the unknown kind is the .app there).
[macos]
# The deployment target the release is built for (MACOSX_DEPLOYMENT_TARGET, as the Tauri CLI set it
# from this setting) and the Info.plist's LSMinimumSystemVersion (plan section 9, question 5).
minimum-system-version = "11.0"
# The bundle's Info.plist, filled in with the version by `cargo xtask package` (its head says what).
info-plist-path = "platform/macos/Info.plist"

# Today's disk image (read off v0.3.16's RustRadar_0.3.16_aarch64.dmg: its .DS_Store): a 660 x 400
# window, RustRadar.app at (180, 170) and the Applications link at (480, 170), tauri-bundler's
# defaults; 128 px icons, 16 px text, no background, the volume named RustRadar with the app's icon.
# cargo-packager's own default window is 600 x 400. Its names for these keys.
[dmg]
window-size = { width = 660, height = 400 }
app-position = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }
