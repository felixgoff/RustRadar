[package]
name = "rustradar-app"
version = "0.1.0"
edition = "2024"
description = "Native RustRadar client: winit window, wgpu rendering, egui UI (no webview)"

[lib]
name = "rustradar_app"
# rlib for the desktop binary and tests; cdylib/staticlib are what the Android
# (NativeActivity loads a .so) and iOS (Xcode links a .a) shells need.
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "rustradar-app"
path = "src/main.rs"

[dependencies]
rustradar-core = { workspace = true }
rustradar-scene = { workspace = true }
rustradar-map = { workspace = true }
rustradar-backend = { workspace = true }
tokio = { workspace = true }
# These five must move together: egui-wgpu 0.37 pins wgpu 30 and
# egui-winit 0.37 pins winit 0.30 (winit 0.31 is still beta).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = "30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
# Windowing backends and clipboard are chosen per platform below.
egui-winit = { version = "0.37", default-features = false }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

[dev-dependencies]
png = "0.18"

# Desktop: X11 + Wayland, system clipboard (arboard), opening links.
# arboard does not build for iOS (it falls into its Linux/Wayland branch) and
# has no Android backend, so mobile gets egui's in-process clipboard until a
# native one is written.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
winit = "0.30.13"

[target.'cfg(target_os = "ios")'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["links"] }

[target.'cfg(target_os = "android")'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["links"] }
# winit refuses to build for Android without choosing an activity backend: GameActivity, whose
# GameTextInput the text bridge reads (platform/android.rs; plan 1.5). Its Java half is
# androidx.games:games-activity 4.4.0 in platform/android, the version android-activity 0.6 glues.
winit = { version = "0.30.13", features = ["android-game-activity"] }
# MainActivity.leave() (the version android-activity uses), and the log in logcat.
jni = "0.22"
android_logger = { version = "0.15", default-features = false }
