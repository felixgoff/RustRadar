[package]
name = "rustradar-core"
version = "0.1.0"
edition = "2024"
description = "RustRadar's pure logic and data types: no I/O, no clock, no async, no GPU, no UI"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
unicode-normalization = { workspace = true }
regex = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }

[features]
# The Android app's build (the app turns it on for Android only): the files of `assets` are
# read from the APK's assets/ folder at startup instead of embedded in the library (risk K14).
apk-assets = []
